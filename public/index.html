<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Room of Lies v1.9.5</title>
<style>
    * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body { background: #111; color: #eee; margin: 0; padding: 10px; }
  .hidden { display: none; }
  .container { max-width: 600px; margin: auto; }
  button { background: #55ff55; color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: bold; width: 100%; margin-top: 8px; cursor: pointer; }
  button.danger { background: #ff5555; color: #fff; }
  button.secondary { background: #444; color: #fff; }
  input { width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; border: none; background: #222; color: #eee; }
  .card { background: #1a1a1a; padding: 15px; border-radius: 10px; margin-top: 10px; }
  .phase { text-align: center; font-size: 18px; font-weight: bold; color: #55ff55; }
  .timer { text-align: center; font-size: 24px; margin: 5px 0; }
  .clue { background: #222; padding: 10px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #55ff55; }
  .chat { height: 200px; overflow-y: auto; background: #000; padding: 10px; border-radius: 8px; margin-top: 10px; }
  .msg { margin: 4px 0; }
  .msg .from { font-weight: bold; color: #55ff55; }
  .player { display: flex; justify-content: space-between; padding: 8px; background: #222; border-radius: 6px; margin: 4px 0; }
  .player.dead { opacity: 0.4; text-decoration: line-through; }
  .vote-btn { background: #ffaa00; padding: 6px 10px; width: auto; font-size: 12px; }
  #roleCard { text-align: center; }
  #roleCard h2 { color: #55ff55; }
</style>
</head>
