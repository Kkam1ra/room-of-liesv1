 <button id="policeChooseBtn" onclick="policeChoosePrompt()" style="display:none">Choose Elimination</button>

<script>
socket.on('roleAssigned', data => {
  //... same
  if(data.role === 'Police') policeChooseBtn.style.display = 'inline'; // show police button
});

socket.on('policeDecision', data => {
  const target = prompt("Who should be eliminated? Enter name:\nVotes: " + JSON.stringify(data.votes));
  const targetPlayer = players.find(p=>p.name.toLowerCase()===target.toLowerCase());
  if(targetPlayer) socket.emit('policeChoose', {code: myRoom, targetId: targetPlayer.id});
});

socket.on('phaseChange', data => {
  //... same
  if(data.phase === 'police') { chat.innerHTML += '<p style="color:blue">--- POLICE IS CHOOSING ---</p>'; }
});
</script>
