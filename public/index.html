<!DOCTYPE html>
<html>
<head>
<title>Gangster Investigation v5.6.1</title>
<style>
body{background:#111;color:#fff;font-family:Arial;text-align:center}
.btn{background:#c00;color:#fff;border:none;padding:10px 20px;margin:5px;cursor:pointer;border-radius:5px}
#game{display:none}
#chat{height:200px;overflow:auto;border:1px solid #444;margin:10px;padding:5px;text-align:left}
#players{text-align:left}
</style>
</head>
<body>
<h1 style="color:#c00">Gangster Investigation v5.6.1</h1>

<div id="lobby">
  <input id="name" placeholder="Enter Name">
  <button class="btn" onclick="create()">Create Room</button>
  <button class="btn" onclick="join()">Join Room</button>
  <button class="btn" onclick="addBot()">+ Add Bot</button>
  <button class="btn" onclick="start()">Start Game</button>
  <h3>Room: <span id="roomCode"></span></h3>
  <h3>Players:</h3><div id="players"></div>
</div>

<div id="game">
  <div class="phase" id="phase">Lobby</div>
  <div id="puzzle"></div><div id="secret"></div>
  <button class="btn" onclick="vote()">🗳️ Vote Player</button>
  <button class="btn" id="gangBtn" style="display:none;background:#800" onclick="gangVote()">🔪 Gang Kill</button>
  <button class="btn" style="background:#080" onclick="talk()">🎤 Talk</button>
  <button class="btn" style="background:#880" onclick="stop()">🔇 Stop</button>
  <h3>Public Chat</h3><div id="chat"></div>
  <input id="msg" placeholder="Type message..." onkeydown="if(event.key==='Enter')send()"><button class="btn" onclick="send()">Send</button>
</div>

<!-- CRITICAL: LOAD SOCKET FROM SERVER -->
<script src="/socket.io/socket.io.js"></script>
<script>
console.log("JS LOADED"); // If you don't see this in F12 console, JS is broken

const socket = io(); // auto connects to same domain
let roomCode = "", myRole = "", myNumber = "";

function create(){
  const name = document.getElementById('name').value;
  if(!name) return alert('Enter name');
  roomCode = Math.random().toString(36).substr(2,4).toUpperCase();
  socket.emit('createRoom', {playerName: name});
}

function join(){
  const name = document.getElementById('name').value;
  if(!name) return alert('Enter name');
  roomCode = prompt('Enter Room Code:');
  socket.emit('joinRoom', {code: roomCode, playerName: name});
}

function addBot(){ socket.emit('addBot', roomCode); }
function start(){ socket.emit('startGame', roomCode); }
function vote(){ let t=prompt('Vote who? Enter #'); socket.emit('vote',{code:roomCode,targetId:t}) }
function gangVote(){ let t=prompt('Gang kill who? Enter #'); socket.emit('gangVote',{code:roomCode,targetId:t}) }
function send(){ let m=document.getElementById('msg').value; socket.emit('publicMessage',{code:roomCode,msg:m}); document.getElementById('msg').value='' }
function talk(){} function stop(){} // voice placeholder

// SOCKET LISTENERS
socket.on('roomCreated', (d)=>{ roomCode=d.code; document.getElementById('roomCode').innerText=roomCode; });
socket.on('playerList', (players)=>{
  document.getElementById('players').innerHTML = players.map(p=>`${p.name} #${p.number||'?'}`).join('<br>');
});
socket.on('roleAssigned', (d)=>{
  myRole=d.role; myNumber=d.number;
  document.getElementById('lobby').style.display='none';
  document.getElementById('game').style.display='block';
  document.getElementById('secret').innerText = `You are: ${d.role} #${d.number}`;
  if(d.role==='Gangster') document.getElementById('gangBtn').style.display='inline-block';
});
socket.on('roundStart', (d)=>{ document.getElementById('puzzle').innerText = `Round ${d.round}: ${d.clue}` });
socket.on('secretClue', (d)=>{ document.getElementById('secret').innerText += `\n${d}` });
socket.on('phaseChange', (d)=>{ document.getElementById('phase').innerText = `PHASE: ${d.phase}` });
socket.on('publicMsg', (d)=>{ document.getElementById('chat').innerHTML += `<b>${d.from}:</b> ${d.msg}<br>` });
socket.on('systemMsg', (d)=>{ document.getElementById('chat').innerHTML += `<i style="color:yellow">${d}</i><br>` });
socket.on('gameOver', (d)=>{ alert(d.message); location.reload(); });

socket.on('connect_error', (err)=>{ alert("SOCKET ERROR: " + err.message) });
</script>
</body>
</html>
